name: Generate README Snake Animation
on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Manual trigger button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Snake
      uses: Platane/snk@v3
      with:
        github_user_name: 'shubhamshrivastava11'
        outputs: |
          dist/output/github-contribution-grid-snake.svg
          dist/output/github-contribution-grid-snake-dark.svg?palette=github-dark

    - name: Push to output branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist/output
        publish_branch: output
